name: OWL Runtime Main CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-main-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:shell-concurrency-cap
      - run: npx tsx scripts/verify-shell-delete-review.ts
      - run: npm run verify:publish-m6
      - run: npm run verify:publish-m9
